coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 70%

# cmd/ is covered by in-process CLI tests (cmd/*_test.go). Black-box e2e and
# helper scripts are process/orchestration, not unit-covered.
ignore:
  - "main.go"
  - "e2e/**/*"
  - "scripts/**/*"
