name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: ["**"]
    paths-ignore: ['**/*.md']

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.6.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: iec61850ctl
      go-versions: '["1.26", "1.27"]'
      policy-version: v1.5.0
      # The shared default (v2.1.6) predates Go 1.26; the version `make lint` is checked with.
      golangci-lint-version: v2.15.0
    secrets: inherit

  # Stricter than go-ci's total: every package must reach 90 %.
  quality:
    name: per-package coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Per-package coverage gate (>= 90%, no cgo)
        run: make coverage-pkg-check
