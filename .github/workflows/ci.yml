name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: iec61850ctl
      go-versions: '["1.25", "1.26"]'
    secrets: inherit

  quality:
    name: coverage gate + fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Race tests and per-package coverage gate (>= 90%)
        run: make coverage-gate

      - name: Fuzz smoke (5s per target)
        run: make fuzz FUZZTIME=5s
