name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.2.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: iec61850ctl
      go-versions: '["1.25", "1.26"]'
    secrets: inherit

  # Stricter than go-ci's total: every package must reach 90 %.
  quality:
    name: per-package coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Per-package coverage gate (>= 90%, no cgo)
        run: make coverage-pkg-check
