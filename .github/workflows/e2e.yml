name: E2E
run-name: "E2E (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: e2e / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: libiec61850
            timeout: 20
          - stack: iec61850bean
            timeout: 30
          - stack: dscsystems
            timeout: 20
          - stack: iec61850-rust
            timeout: 20
          - stack: self
            timeout: 10
          - stack: server-libiec61850
            timeout: 25
          - stack: server-iec61850bean
            timeout: 35
          - stack: server-dscsystems
            timeout: 25
          - stack: server-iec61850-rust
            timeout: 25
          - stack: server-reader-libiec61850
            timeout: 25
          - stack: server-reader-iec61850bean
            timeout: 35
          - stack: server-reader-dscsystems
            timeout: 25
          - stack: server-reader-iec61850-rust
            timeout: 25
          - stack: goose-libiec61850
            timeout: 15
          - stack: goose-dscsystems
            timeout: 15
          - stack: goose-iec61850-rust
            timeout: 15
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        if: matrix.stack != 'self'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digests from lock
        if: matrix.stack != 'self'
        id: lock
        run: |
          img() { python3 -c 'import json,sys; print(json.load(open("e2e/testdata/interop.lock.json"))["images"][sys.argv[1]])' "$1"; }
          {
            echo "lib=$(img libiec61850)"
            echo "bean=$(img iec61850bean)"
            echo "dsc=$(img dscsystems)"
            echo "rust=$(img iec61850-rust)"
          } >> "$GITHUB_OUTPUT"

      - name: Run e2e
        env:
          CI: "true"
          IEC61850CTL_E2E_STACKS: ${{ matrix.stack }}
          LIBIEC61850_IMAGE: ${{ steps.lock.outputs.lib }}
          IEC61850BEAN_IMAGE: ${{ steps.lock.outputs.bean }}
          DSCSYSTEMS_IMAGE: ${{ steps.lock.outputs.dsc }}
          IEC61850RUST_IMAGE: ${{ steps.lock.outputs.rust }}
        run: make e2e

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true
          echo "stack=${{ matrix.stack }}" > artifacts/stack.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iec61850ctl-e2e-${{ matrix.stack }}
          path: artifacts/
          if-no-files-found: ignore
