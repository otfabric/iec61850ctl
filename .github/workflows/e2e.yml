name: E2E
run-name: "E2E (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: e2e / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: libiec61850
            timeout: 20
          - stack: iec61850bean
            timeout: 30
          - stack: self
            timeout: 10
          - stack: server-libiec61850
            timeout: 25
          - stack: server-iec61850bean
            timeout: 35
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        if: matrix.stack != 'self'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digests from lock
        if: matrix.stack != 'self'
        id: lock
        run: |
          LIB=$(python3 -c 'import json; print(json.load(open("e2e/testdata/interop.lock.json"))["images"]["libiec61850"])')
          BEAN=$(python3 -c 'import json; print(json.load(open("e2e/testdata/interop.lock.json"))["images"]["iec61850bean"])')
          echo "lib=$LIB" >> "$GITHUB_OUTPUT"
          echo "bean=$BEAN" >> "$GITHUB_OUTPUT"

      - name: Run e2e
        env:
          CI: "true"
          IEC61850CTL_E2E_STACKS: ${{ matrix.stack }}
          LIBIEC61850_IMAGE: ${{ steps.lock.outputs.lib }}
          IEC61850BEAN_IMAGE: ${{ steps.lock.outputs.bean }}
        run: make e2e

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true
          echo "stack=${{ matrix.stack }}" > artifacts/stack.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iec61850ctl-e2e-${{ matrix.stack }}
          path: artifacts/
          if-no-files-found: ignore
